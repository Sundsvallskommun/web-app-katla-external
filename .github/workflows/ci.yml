name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend – lint, type-check & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      # src/proxy.ts importerar genererade middleware-envs.js, som behövs för typmedveten lint
      - name: Generate middleware envs
        run: yarn generate:middleware-envs

      - name: Lint (strict)
        run: yarn lint:strict

      - name: Format check
        run: yarn format:check

      - name: Type-check
        run: yarn type-check

      - name: Unit tests (Vitest)
        run: yarn test:coverage

  backend:
    name: Backend – lint, type-check & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Verify Node runtime contract
        working-directory: .
        run: node .github/scripts/verify-node-runtime-contract.mjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Lint (strict)
        run: yarn lint:strict

      - name: Format check
        run: yarn format:check

      - name: Type-check
        run: yarn type-check

      - name: Unit tests (Vitest)
        run: yarn test

  frontend-e2e:
    name: Frontend – e2e tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_NAME: 'Katla'
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      DOMAIN_NAME: localhost
      BASE_PATH: ''
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_PROTECTED_ROUTES: ''
      HEALTH_AUTH: false
      HEALTH_USERNAME: ''
      HEALTH_PASSWORD: ''
      NEXT_PUBLIC_ERRAND_FILTER: true
      NEXT_PUBLIC_REDUCED_STAKEHOLDER_INFO: false
      NEXT_PUBLIC_OTHER_PARTIES_DISCLOSURE: true
      NEXT_PUBLIC_DRAFT_ERRAND: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build
        run: yarn build

      - name: Run Playwright tests
        run: yarn e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
